schema: 1
name: unsupported-sentinels
tags: [read, decode]
description: >
  Tests that built-in sentinel values (0xFFFF for U16, 0x7FFF for S16,
  0xFFFFFFFF for U32, 0x7FFFFFFF for S32) are reported as supported=not-applicable
  with the raw sentinel word preserved.

inverters:
  - id: default
    slave_id: 1
    input:
      4990: { utf8: "A2350415770" }
      5000: 0xE12
      5001: 80
      5002: 0
      # inside_temperature (S16 addr 5008) = 0x7FFF → S16 sentinel → not-applicable
      5008: 0x7FFF
      5071: 1500
      # total_reactive_power (S32 addr 5033-5034) = 0x7FFFFFFF → S32 sentinel → not-applicable
      5033: [0xFFFF, 0x7FFF]
      # daily_pv_generation (U16 addr 13002) = 0xFFFF → U16 sentinel → not-applicable
      13002: 0xFFFF
      13037: [500, 0]
      13039: 160
    holding:
      5000: 2025
      5001: 1
      5002: 1
      5003: 0
      5004: 0
      5005: 0
      33500: 0x55

expect:
  read:
    # U16 sentinel: 0xFFFF → not-applicable, raw word preserved
    daily_pv_generation: { supported: "not-applicable" }
    # S16 sentinel: 0x7FFF → not-applicable, raw word preserved
    inside_temperature: { supported: "not-applicable" }
    # S32 sentinel: 0x7FFFFFFF → not-applicable, raw word preserved
    total_reactive_power: { supported: "not-applicable" }
    # Sanity: a normal register is still present
    array_insulation_resistance: { value: 1500, unit: "k-ohm" }
