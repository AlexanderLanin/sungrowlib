schema: 1
name: unsupported-sentinels
tags: [read, decode]
description: >
  Tests that built-in sentinel values (0xFFFF for U16, 0x7FFF for S16,
  0xFFFFFFFF for U32/S32) cause registers to be absent from read output.

inverters:
  - id: default
    slave_id: 1
    input:
      4990: { utf8: "A2350415770" }
      5000: 0xE12
      5001: 80
      5002: 0
      # inside_temperature (S16 addr 5008) = 0x7FFF → S16 sentinel → absent
      5008: 0x7FFF
      5071: 1500
      # meter_active_power (S32 addr 5601-5602) = 0xFFFFFFFF → U32 sentinel → absent
      5601: [0xFFFF, 0xFFFF]
      # daily_pv_generation (U16 addr 13002) = 0xFFFF → U16 sentinel → absent
      13002: 0xFFFF
      13037: [500, 0]
      13039: 160
    holding:
      5000: 2025
      5001: 1
      5002: 1
      5003: 0
      5004: 0
      5005: 0
      33500: 0x55

expect:
  read:
    # U16 sentinel: 0xFFFF → null → absent
    daily_pv_generation: absent
    # S16 sentinel: 0x7FFF → null → absent
    inside_temperature: absent
    # S32 sentinel: 0xFFFFFFFF → null → absent
    meter_active_power: absent
    # Sanity: a normal register is still present
    array_insulation_resistance: { value: 1500, unit: "k-ohm" }
