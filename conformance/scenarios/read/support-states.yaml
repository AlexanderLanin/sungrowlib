schema: 1
name: support-states
tags: [read, decode]
description: >
  Exercises all four Support states in one read.
  'yes': non-zero value observed.
  'not-applicable': register returned a built-in NA sentinel value.
  'unknown': returned 0 in both block and individual verification reads.
  'unsupported': Modbus exception on individual verification read (single_only fault).

inverters:
  - id: default
    slave_id: 1
    input:
      4990: { utf8: "A2350415770" }
      5000: 0xE12               # device_type_code → SH8.0RT-20
      5001: 80
      5002: 0
      5008: 0x7FFF              # inside_temperature: S16 NA sentinel → not-applicable
      5071: 1500                # array_insulation_resistance (non-zero → yes; direct_lan indicator)
      13037: [500, 0]           # total_import_energy (is_master indicator, non-zero)
      13039: 160                # battery_capacity_legacy (has_battery indicator, non-zero)
      # battery_power (5214-5215, S32, has_battery): not set → 0 in block + verification → unknown
      # battery_current (5631, S16, has_battery): not set → 0 in block, error in verification → unsupported
    faults:
      # Trigger only for single-register verification reads of battery_current.
      # The initial multi-register block read succeeds and returns 0.
      - range: [5631, 5631]
        error: illegal_data_address
        single_only: true
    holding:
      5000: 2025
      5001: 1
      5002: 1
      5003: 0
      5004: 0
      5005: 0
      33500: 0x55

expect:
  read:
    # non-zero value seen
    array_insulation_resistance: { supported: "yes", value: 1500, unit: "k-ohm" }
    # S16 NA sentinel (0x7FFF)
    inside_temperature: { supported: "not-applicable" }
    # zero in both block and individual verification reads
    battery_power: { supported: "unknown" }
    # zero in block read, Modbus illegal_data_address on individual verification
    battery_current: { supported: "unsupported" }
