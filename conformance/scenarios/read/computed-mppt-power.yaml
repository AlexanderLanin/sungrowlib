schema: 1
name: computed-mppt-power
tags: [read, computed]
description: >
  Validates computed MPPT power (P = V × I) for multiple MPPTs.
  Also tests that mppt_N_power is absent when voltage/current are missing.

inverters:
  - id: default
    slave_id: 1
    input:
      4990: { utf8: "A2350415770" }
      5000: 0xE12
      5001: 80
      5002: 0
      # MPPT 1: 320.0V × 8.5A = 2720.0W
      5011: 3200
      5012: 85
      # MPPT 2: 250.0V × 4.0A = 1000.0W
      5013: 2500
      5014: 40
      5071: 1500
      5601: 0xFFFF
      13037: [500, 0]
      13039: 160
    holding:
      5000: 2025
      5001: 6
      5002: 15
      5003: 14
      5004: 30
      5005: 45
      33500: 0x55

expect:
  read:
    mppt_1_voltage: { value: 320.0, unit: V }
    mppt_1_current: { value: 8.5, unit: A }
    mppt_1_power:   { approx: 2720.0, tolerance: 0.1 }

    mppt_2_voltage: { value: 250.0, unit: V }
    mppt_2_current: { value: 4.0, unit: A }
    mppt_2_power:   { approx: 1000.0, tolerance: 0.1 }

    # MPPTs 3-12 have no input data → power absent
    mppt_3_power:   absent
    mppt_4_power:   absent
