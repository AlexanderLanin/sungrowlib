schema: 1
name: decoded-unknown-value
tags: [read, decode]
description: >
  When a decoded register returns a value not in its lookup table, the CLI
  outputs the raw numeric value rather than an error or null.
  Tested with running_state=99, which has no entry in the decode table.

inverters:
  - id: default
    slave_id: 1
    input:
      4990: { utf8: "A2350415770" }
      5000: 0xE12               # device_type_code → SH8.0RT-20
      5001: 80
      5002: 0
      5071: 1500                # direct_lan indicator
      13000: 99                 # running_state: 99 not in decoded table → raw numeric fallthrough
      13037: [500, 0]           # is_master indicator
      13039: 160                # has_battery indicator
    holding:
      33500: 0x55               # master_slave_mode = Disabled

expect:
  read:
    running_state: { supported: "yes", value: "<unknown:99>" }
