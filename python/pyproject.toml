[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sungrowlib"
version = "0.1.0"
description = "Python library for Sungrow inverter communication over Modbus TCP"
requires-python = ">=3.12"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sungrowlib = "sungrowlib.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sungrowlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
