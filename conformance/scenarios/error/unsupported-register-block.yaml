schema: 1
name: unsupported-register-block
tags: [error, resilience]
description: >
  Modbus exception "illegal data address" on MPPT register block.
  The lib should gracefully skip that block and still decode other registers.

inverters:
  - id: default
    slave_id: 1
    input:
      4990: { utf8: "A2350415770" }
      5000: 0xE12
      5001: 80
      5002: 0
      5071: 1500
      5601: 0xFFFF
      13003: [255, 0]
      13008: 402
      13010: 65134
      13037: [500, 0]
      13039: 160
    holding:
      5000: 2025
      5001: 1
      5002: 1
      5003: 12
      5004: 0
      5005: 0
      33500: 0x55
    faults:
      # MPPT registers return illegal_data_address
      - range: [5011, 5018]
        error: illegal_data_address

expect:
  info:
    model: "SH8.0RT-20"
    connection_mode: standalone

  read:
    # These are in a different block and should still work
    load_power:   { value: 402, unit: W }
    export_power: { value: -402, unit: W }
    total_pv_generation: { value: 25.5, unit: kWh }

    # MPPT block failed — computed power cannot be calculated
    mppt_1_power: absent
