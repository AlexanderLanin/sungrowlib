schema: 1
name: model-override-s16
tags: [read, decode]
description: >
  SH8.0RT-20 has model overrides: load_power and export_power
  are S32 in the catalog but overridden to S16 for this model.
  Tests that the override produces correct signed values from a single word.

inverters:
  - id: default
    slave_id: 1
    input:
      4990: { utf8: "A2350415770" }
      5000: 0xE12
      5001: 80
      5002: 0
      5071: 1500
      5601: 0xFFFF
      # load_power at 13008: raw 402 → S16 = +402 W
      13008: 402
      # The word after it (13009) would be high word in S32 mode — must be ignored
      13009: 0
      # export_power at 13010: raw 65134 → S16 = -402 W
      13010: 65134
      13011: 65535
      13037: [500, 0]
      13039: 160
    holding:
      5000: 2025
      5001: 1
      5002: 1
      5003: 12
      5004: 0
      5005: 0
      33500: 0x55

expect:
  read:
    load_power:    { value: 402, unit: W }
    export_power:  { value: -402, unit: W }
