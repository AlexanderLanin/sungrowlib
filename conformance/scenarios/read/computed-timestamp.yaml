schema: 1
name: computed-timestamp
tags: [read, computed]
description: >
  Validates timestamp synthesis from 6 RTC holding registers.
  Also tests 4-digit year handling.

inverters:
  - id: default
    slave_id: 1
    input:
      4990: { utf8: "A2350415770" }
      5000: 0xE12
      5001: 80
      5002: 0
      5071: 1500
      5601: 0xFFFF
      13037: [500, 0]
      13039: 160
    holding:
      # RTC: 2025-03-07 09:05:02
      5000: 2025
      5001: 3
      5002: 7
      5003: 9
      5004: 5
      5005: 2
      33500: 0x55

expect:
  read:
    timestamp: { value: "2025-03-07 09:05:02" }
