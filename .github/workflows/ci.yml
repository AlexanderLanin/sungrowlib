name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  conformance:
    runs-on: ubuntu-latest
    needs: [typescript, python]
    strategy:
      matrix:
        include:
          - name: typescript
            setup: cd ts && npm install && npm run build
            cli: node ts/dist/cli/main.js
          - name: python
            setup: cd python && pip install -e .
            cli: sungrowlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.setup }}
      - name: Conformance (${{ matrix.name }})
        run: python3 conformance/runner/run.py --scenarios conformance/scenarios/ --cli '${{ matrix.cli }}' --verbose
